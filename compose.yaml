services:
    beekeeper_api:
        container_name: beekeeper_api
        image: beekeeper_api
        restart: always
        build:
            context: ./api
            dockerfile: Dockerfile
        ports:
            - "8002:8080"
        env_file:
            - .env
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s
        mem_limit: 1g
        cpus: "2.0"
